# Usado quando este diretório é a raiz do repositório GitHub (repo só backend).
# Monorepo: use .github/workflows na raiz do projeto.

name: Deploy main (produção)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image owner (lowercase)
        run: echo "IMAGE_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/comunidade-backend:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/comunidade-backend:main

      - name: Deploy na VPS (produção)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          command_timeout: 25m
          script: |
            set -e
            cd /opt/comunidade-prod
            docker compose pull backend
            docker compose up -d backend
            docker compose exec -T backend npx prisma migrate deploy
