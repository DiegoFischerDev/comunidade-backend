# Stage (branch stage). Copie para a VPS em /opt/comunidade-stage/docker-compose.yml
# Use imagens com tag :stage (ex: ghcr.io/SEU_USER/comunidade-backend:stage)

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: comunidade
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: comunidade
    volumes:
      - postgres_data_stage:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comunidade"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ${IMAGE_BACKEND:-ghcr.io/SEU_USER/comunidade-backend:stage}
    restart: unless-stopped
    environment:
      PORT: 3001
      NODE_ENV: production
      DATABASE_URL: postgresql://comunidade:${POSTGRES_PASSWORD}@postgres:5432/comunidade?schema=public
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_AMOUNT_EUR_CENTS: ${STRIPE_AMOUNT_EUR_CENTS}
      STRIPE_PIX_AMOUNT_BRL: ${STRIPE_PIX_AMOUNT_BRL}
      STRIPE_RAFA_CALL_EUR_CENTS: ${STRIPE_RAFA_CALL_EUR_CENTS:-2000}
      STRIPE_RAFA_CALL_PIX_BRL: ${STRIPE_RAFA_CALL_PIX_BRL:-2000}
      CALENDLY_WEBHOOK_SIGNING_KEY: ${CALENDLY_WEBHOOK_SIGNING_KEY}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: ${IMAGE_FRONTEND:-ghcr.io/SEU_USER/comunidade-frontend:stage}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_CALENDLY_EVENT_URL: ${NEXT_PUBLIC_CALENDLY_EVENT_URL}
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx.stage.conf:/etc/nginx/nginx.conf:ro
      - ./certs-stage:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data_stage:
