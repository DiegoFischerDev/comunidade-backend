# Nginx stage. Salve como nginx.stage.conf em /opt/comunidade-stage/
# Use portas 8080/8443 no host para não conflitar com prod. Ajuste server_name (ex: stage.seudominio.com).

events { worker_connections 1024; }

http {
  client_max_body_size 80m;

  upstream frontend {
    server frontend:3000;
  }
  upstream backend {
    server backend:3001;
  }

  server {
    listen 80;
    server_name stage.seudominio.com;
    location / {
      return 301 https://$host$request_uri;
    }
  }
  server {
    listen 80;
    server_name api-stage.seudominio.com;
    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    server_name stage.seudominio.com;
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    location / {
      proxy_pass http://frontend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
    }
  }

  server {
    listen 443 ssl;
    server_name api-stage.seudominio.com;
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    client_max_body_size 80m;
    location / {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
