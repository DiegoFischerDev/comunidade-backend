# Produção (branch main). Copie para a VPS em /opt/comunidade-prod/docker-compose.yml
# Ajuste IMAGE_BACKEND e IMAGE_FRONTEND para seu GHCR (ex: ghcr.io/SEU_USER/comunidade-backend:latest)

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: comunidade
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: comunidade
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comunidade"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ${IMAGE_BACKEND:-ghcr.io/SEU_USER/comunidade-backend:latest}
    restart: unless-stopped
    environment:
      PORT: 3001
      NODE_ENV: production
      DATABASE_URL: postgresql://comunidade:${POSTGRES_PASSWORD}@postgres:5432/comunidade?schema=public
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      RAFA_CALL_DURATION_MINUTES: ${RAFA_CALL_DURATION_MINUTES:-30}
      RAFA_CALL_BUFFER_MINUTES: ${RAFA_CALL_BUFFER_MINUTES:-10}
      RAFA_CALL_WINDOW_DAYS: ${RAFA_CALL_WINDOW_DAYS:-14}
      RAFA_CALL_WORKING_HOURS_JSON: ${RAFA_CALL_WORKING_HOURS_JSON:-}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: ${IMAGE_FRONTEND:-ghcr.io/SEU_USER/comunidade-frontend:latest}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data_prod:
