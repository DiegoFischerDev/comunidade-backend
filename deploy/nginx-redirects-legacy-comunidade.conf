# Redirects 301 — domínios legados Comunidade → Move Casa
# Substituir prod-comunidade-rafaportugal.conf e prod-api-comunidade-rafaportugal.conf
# (ou incluir estes blocos no mesmo ficheiro).

# comunidade.rafaportugal.com → movecasa.pt
server {
    listen 80;
    server_name comunidade.rafaportugal.com;
    return 301 https://movecasa.pt$request_uri;
}

server {
    listen 443 ssl;
    server_name comunidade.rafaportugal.com;

    ssl_certificate /etc/letsencrypt/live/comunidade.rafaportugal.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/comunidade.rafaportugal.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://movecasa.pt$request_uri;
}

# api-comunidade.rafaportugal.com → api.movecasa.pt
server {
    listen 80;
    server_name api-comunidade.rafaportugal.com;
    return 301 https://api.movecasa.pt$request_uri;
}

server {
    listen 443 ssl;
    server_name api-comunidade.rafaportugal.com;

    ssl_certificate /etc/letsencrypt/live/comunidade.rafaportugal.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/comunidade.rafaportugal.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 1000m;

    return 301 https://api.movecasa.pt$request_uri;
}

