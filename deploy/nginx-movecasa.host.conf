# Move Casa — produção na VPS (nginx no host → Docker 13000/13001)
# Copiar para /etc/nginx/sites-available/movecasa e ativar em sites-enabled.
# Certificado: certbot certonly --nginx -d movecasa.pt -d api.movecasa.pt

# HTTP → HTTPS
server {
    listen 80;
    server_name movecasa.pt www.movecasa.pt api.movecasa.pt;
    return 301 https://$host$request_uri;
}

# Frontend (apex; www redireciona para apex)
server {
    listen 443 ssl;
    server_name movecasa.pt www.movecasa.pt;

    ssl_certificate /etc/letsencrypt/live/movecasa.pt/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/movecasa.pt/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    if ($host = www.movecasa.pt) {
        return 301 https://movecasa.pt$request_uri;
    }

    client_max_body_size 120m;

    location / {
        proxy_pass http://127.0.0.1:13000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# API
server {
    listen 443 ssl;
    server_name api.movecasa.pt;

    ssl_certificate /etc/letsencrypt/live/movecasa.pt/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/movecasa.pt/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 1000m;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    location / {
        proxy_pass http://127.0.0.1:13001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
