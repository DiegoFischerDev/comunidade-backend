# Stage na VPS compartilhada (sem nginx no container).
# Nginx do HOST faz proxy para estas portas. Use com deploy/README-VPS-HOSTINGER.md

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: comunidade
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: comunidade
    volumes:
      - postgres_data_stage:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comunidade"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ${IMAGE_BACKEND:-ghcr.io/SEU_USER/comunidade-backend:stage}
    restart: unless-stopped
    environment:
      PORT: 3001
      NODE_ENV: production
      DATABASE_URL: postgresql://comunidade:${POSTGRES_PASSWORD}@postgres:5432/comunidade?schema=public
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      RESEND_API_KEY: ${RESEND_API_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
      ADMIN_WHATSAPP: ${ADMIN_WHATSAPP:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_AMOUNT_EUR_CENTS: ${STRIPE_AMOUNT_EUR_CENTS:-2300}
      STRIPE_PIX_AMOUNT_BRL: ${STRIPE_PIX_AMOUNT_BRL:-2300}
      # Registo / confirmação via WhatsApp (Evolution) — mesmo segredo que no wa-verify
      COMMUNITY_INTERNAL_SECRET: ${COMMUNITY_INTERNAL_SECRET}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-comunidade}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      WHATSAPP_REGISTRATION_NUMBER: ${WHATSAPP_REGISTRATION_NUMBER:-351927398547}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:13003:3001"

  frontend:
    image: ${IMAGE_FRONTEND:-ghcr.io/SEU_USER/comunidade-frontend:stage}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    depends_on:
      - backend
    ports:
      - "127.0.0.1:13002:3000"

volumes:
  postgres_data_stage:
