# Produção na VPS (nginx no host). Ver deploy/README-VPS-HOSTINGER.md
# Variáveis: .env no mesmo diretório que o compose.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: comunidade
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: comunidade
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comunidade"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ${IMAGE_BACKEND:-ghcr.io/SEU_USER/comunidade-backend:latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 3001
      NODE_ENV: production
      DATABASE_URL: postgresql://comunidade:${POSTGRES_PASSWORD}@postgres:5432/comunidade?schema=public
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL}
      # Rafa Call — sobrepõe env_file se definido; omissões abaixo
      STRIPE_RAFA_CALL_EUR_CENTS: ${STRIPE_RAFA_CALL_EUR_CENTS:-2000}
      STRIPE_RAFA_CALL_PIX_BRL: ${STRIPE_RAFA_CALL_PIX_BRL:-2000}
      RAFA_CALL_DURATION_MINUTES: ${RAFA_CALL_DURATION_MINUTES:-15}
      RAFA_CALL_BUFFER_MINUTES: ${RAFA_CALL_BUFFER_MINUTES:-10}
      RAFA_CALL_WINDOW_DAYS: ${RAFA_CALL_WINDOW_DAYS:-14}
      RAFA_CALL_WORKING_HOURS_JSON: ${RAFA_CALL_WORKING_HOURS_JSON:-}
    depends_on:
      postgres:
        condition: service_healthy
    # Não correr migrate no arranque: npx + Prisma em VPS pequenas → OOM (exit 137).
    # Migrações: no deploy, `docker compose run --rm --no-deps backend npx prisma migrate deploy` antes do up.
    ports:
      - "127.0.0.1:13001:3001"
    volumes:
      - ${HOST_UPLOADS_PATH_PROD:-/opt/comunidade-prod/uploads}:/app/uploads

  frontend:
    image: ${IMAGE_FRONTEND:-ghcr.io/SEU_USER/comunidade-frontend:latest}
    restart: unless-stopped
    # URLs públicas: o JS do browser já vem com estes valores do build (CI: build-args). Aqui
    # alinhamos o .env da VPS e o processo do servidor Node; para mudar o que o cliente vê, reconstrói a imagem.
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    depends_on:
      - backend
    ports:
      - "127.0.0.1:13000:3000"

volumes:
  postgres_data_prod:
